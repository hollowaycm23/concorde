name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Decode certificate
        run: |
          echo "${{ secrets.WINDOWS_CERTIFICATE }}" | base64 --decode > electron/signing/certificate.pfx
        shell: bash
      
      - name: Build and publish
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      
      - name: Upload to generic server (optional)
        if: env.UPLOAD_URL != ''
        run: |
          # Upload para servidor próprio (ex: S3, CDN)
          aws s3 sync dist/ s3://releases.seudominio.com/discord-clone/ --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}